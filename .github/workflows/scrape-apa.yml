name: Scrape APA

on:
  # Friday 8am Eastern (13:00 UTC standard / 12:00 UTC daylight — picking 13:00
  # so we run at 8am EST or 9am EDT; either is fine, just after pool-night
  # scores are in).
  schedule:
    - cron: "0 13 * * 5"
  # Manual trigger from the Actions tab.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Workflow cap is higher than the scrape's own time budget
    # (APA_TIME_BUDGET_MIN=45 by default) so we always have headroom for
    # the projection step + commit + push to finish cleanly.
    timeout-minutes: 75

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so the auto-commit can push without "shallow update not allowed".
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run sync (scrape + project)
        env:
          APA_USERNAME: ${{ secrets.APA_USERNAME }}
          APA_PASSWORD: ${{ secrets.APA_PASSWORD }}
          # The scraper auto-pivots to the newest-session team via the
          # persistent team `number`, so this fallback only matters when
          # the configured id is so old that no current roster member's
          # alias history reaches it. Keep it on a recent Eight Men Out
          # team id.
          APA_TEAM_URL: ${{ vars.APA_TEAM_URL || 'https://league.poolplayers.com/southjersey/team/13022793' }}
        run: npm run sync

      - name: Commit & push if data changed
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain data/cache data/apa.json)" ]]; then
            echo "No data changes — skipping commit."
            exit 0
          fi

          git config user.name "apa-scraper-bot"
          git config user.email "apa-scraper-bot@users.noreply.github.com"

          # The scrape runs for several minutes against a SHA fixed at
          # checkout, so `main` can move underneath us — a PR merges, or this
          # is a re-run of an older run — and the push is rejected as
          # non-fast-forward. These files are generated output, not authored
          # edits, so on a race we replay them onto the new tip instead of
          # trying to merge single-line JSON.
          snapshot="$(mktemp -d)"
          cp -a data/cache "$snapshot/cache"
          cp -a data/apa.json "$snapshot/apa.json"

          for attempt in 1 2 3 4 5; do
            git add data/cache data/apa.json
            git commit -q -m "chore: weekly APA sync ($(date -u +%Y-%m-%d))"

            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt} — replaying onto the current main."
            git fetch origin main
            git reset -q --hard FETCH_HEAD
            # Copy over the new tip rather than replacing the directory, so
            # any cache entries main picked up meanwhile survive.
            cp -a "$snapshot/cache/." data/cache/
            cp -a "$snapshot/apa.json" data/apa.json

            if [[ -z "$(git status --porcelain data/cache data/apa.json)" ]]; then
              echo "main already carries this data — nothing left to push."
              exit 0
            fi

            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push the sync commit after 5 attempts."
          exit 1
